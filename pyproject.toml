[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "DocWorkflow"
version = "0.1.0"
description = "Document analysis framework for layout segmentation, line detection, and HTR"
readme = "README.md"
requires-python = ">=3.9,<3.12"
authors = [
    {name = "Théo Moins", email = "theo.moins@chartes.psl.eu"}
]
keywords = [
    "document-analysis",
    "htr",
    "layout-analysis",
    "alto-xml"
]

# NOTE: pixi.toml is the source of truth for versions — it carries the exact pins
# resolved in pixi.lock (e.g. transformers 5.2.0, torch 2.10/cu128 in the train
# env). The constraints below are deliberately kept as loose lower bounds so they
# never contradict the lock; do not add upper pins here without mirroring them in
# pixi.toml.
dependencies = [
    # Deep Learning & Computer Vision
    "ultralytics>=8.4.8",

    # Kraken ecosystem
    "kraken>=5.3.0",

    # Image processing
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",

    # Scientific computing
    "numpy>=1.23.0,<3.0.0",
    "scipy>=1.13.0",

    # XML processing
    "lxml>=5.0.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",

    # Configuration & Data
    "PyYAML>=6.0.0",
    "pandas>=2.0.0",
    "tabulate>=0.8.10,<1.0.0",

    # Metrics
    "mean-average-precision>=2024.1.5.0",
    "jiwer>=3.0.0",
    "torchmetrics>=1.0.0",
    "regex>=2023.0.0",

    # Visualization
    "matplotlib>=3.7.0",

    # System monitoring
    "psutil>=5.9.0",

    # Weights and Biases
    "wandb>=0.25.0",

    # VLM
    "peft>=0.10.0",
    "qwen-vl-utils>=0.0.1",
    "transformers>=4.55.0"
]

[project.optional-dependencies]
# Dépendances pour le développement
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
]

# Dépendances pour GPU (CUDA)
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
]

# Dépendances pour l'entraînement VLM (environnement séparé)
# Ne pas réintroduire l'extra [cu121-torch240] : il épingle torch 2.4 / CUDA 12.1
# et contredit l'environnement `train` de pixi (torch 2.10 / CUDA 12.8).
# Cet extra n'est pas installé par pixi, qui déclare unsloth directement dans
# [feature.train.pypi-dependencies] — il n'est là que pour un `pip install .[train]`.
train = [
    "unsloth>=2026.3",
    "datasets>=2.14.0",
]

[project.scripts]
docworkflow = "src.__main__:cli"

[project.urls]
Homepage = "https://github.com/TheoMoins/DocWorkflow"
Documentation = "https://github.com/TheoMoins/DocWorkflow/blob/main/README.md"
Repository = "https://github.com/TheoMoins/DocWorkflow"
Issues = "https://github.com/TheoMoins/DocWorkflow/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# pytest configuration lives in pytest.ini (which takes priority over this file
# anyway). It declares the requires_main / requires_training markers that
# tests/test_imports*.py rely on; duplicating a partial copy here only risked
# the two drifting apart under --strict-markers.

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]
skip_gitignore = true