# Continue MEDUSA 0.2 4B (modèle déjà fusionné, publié) sur du multiligne k=4, 1 époque.
# Pas de base_model : model_name est un modèle complet, le nouveau LoRA est ajouté directement.
run_name: "ML-Medusa0.2-4B_k4"
output_dir: "results"
device: "cuda"
use_wandb: false
wandb_project: "icdar-htr-competition-2026"
save_image: true

data:
  train:
    - "../data/ICDAR_Competition/platinum_romance"
    - "../data/ICDAR_Competition/platinum_nonromance"
    - "../data/ICDAR_Competition/gold_romance"
    - "../data/ICDAR_Competition/gold_nonromance"
  valid: "../data/ICDAR_Competition/valid"

tasks:
  htr:
    type: VLMMultiLineHTR
    config:
      use_metadata: true
      model_name: '/lustre/fswork/projects/rech/uoe/ugg16ol/models/Medusa0.2Line-4B'
      model_dir: 'outputs_ML-Medusa0.2-4B_k4/'
      device_map: "auto"
      lines_per_crop: 4
      max_new_tokens: 512
      line_batch_size: 4
      # Même valeur que MEDUSA ; la règle d'échelle en fonction de k sera mesurée en phase 3.3
      # (03_plan_htr_multiligne.md). Un crop de 4 lignes est donc sous-échantillonné.
      max_pixels: 401408
      special_char_weighting: 0

      # LoRA
      use_4bit: false
      use_8bit: false
      lora_r: 64
      lora_dropout: 0
      use_rlora: false
      # 512 en ligne-à-ligne : un crop de 4 lignes = ~512 jetons image + ~4x plus de texte
      max_seq_length: 1024
      # Séquences ~2x plus longues qu'en ligne-à-ligne : 16 x 2 garde le batch effectif de 32
      train_batch_size: 16
      gradient_accumulation_steps: 2
      warmup_ratio: 0.01
      epochs: 1
      # ~4 700 pas par époque : sauvegarder/évaluer avant la fin pour pouvoir reprendre
      save_steps: 1000
      eval_steps: 1000
      logging_steps: 50

      # lr
      learning_rate: 5.0e-5
      weight_decay: 0.02
      dataset_num_proc: 4
      prompt_template: >
        Transcribe the handwritten text in this image, one output line per line of text.
        {conventions}
        Output ONLY the transcription.
