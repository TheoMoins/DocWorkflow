# Variante B : troisième couche LoRA multiligne (1 époque gold+platinum) au-dessus de T3-2.
# Prérequis : fusionner T3-2 en un modèle complet (cf. message de retour, merge_lora_medusa.py).
# Pas de base_model : model_name est un modèle complet, on y ajoute directement le nouveau LoRA.
run_name: "ML-T3-3_k4"
output_dir: "results"
device: "cuda"
use_wandb: false
wandb_project: "icdar-htr-competition-2026"
save_image: true

data:
  train:
    - "../data/ICDAR_Competition/platinum_romance"
    - "../data/ICDAR_Competition/platinum_nonromance"
    - "../data/ICDAR_Competition/gold_romance"
    - "../data/ICDAR_Competition/gold_nonromance"
  valid: "../data/ICDAR_Competition/valid"
  test: "../data/ICDAR_Competition/test"

tasks:
  htr:
    type: VLMMultiLineHTR
    config:
      use_metadata: true
      model_name: 'outputs_T3-2/merged_full'
      model_dir: 'outputs_ML-T3-3_k4/'
      device_map: "auto"
      lines_per_crop: 4
      max_new_tokens: 512
      line_batch_size: 4
      # Même valeur que T3 ; la règle d'échelle en fonction de k sera mesurée en phase 3.3
      # (03_plan_htr_multiligne.md). Un crop de 4 lignes est donc sous-échantillonné.
      max_pixels: 401408
      special_char_weighting: 0

      # LoRA
      use_4bit: false
      use_8bit: false
      lora_r: 64
      lora_dropout: 0
      use_rlora: false
      # 512 en ligne-à-ligne : le crop multiligne atteint ~512 jetons image (max_pixels / 28²)
      # plus ~4x plus de texte, 512 tronquerait la cible
      max_seq_length: 1024
      # Séquences ~2x plus longues qu'en T3 : 16 x 2 garde le batch effectif de 32
      train_batch_size: 16
      gradient_accumulation_steps: 2
      warmup_ratio: 0.01
      epochs: 1

      # lr
      learning_rate: 5.0e-5
      weight_decay: 0.02
      dataset_num_proc: 4
      prompt_template: >
        Transcribe the handwritten text in this image, one output line per line of text.
        {conventions}
        Output ONLY the transcription.
